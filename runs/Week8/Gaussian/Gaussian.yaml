nExecutable: EvolveScalarWave1D
Testing:
  Check: parse
  Priority: High
ExpectedOutput:
n  - ScalarWavePlaneWave1DEventsAndTriggersBasicVolume.h5

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InitialData:
  Gaussian:


Amr:
  Criteria:
    - TruncationError:
        VariablesToMonitor: [Psi]
        AbsoluteTarget: 1.e-6
        RelativeTarget: 1.0
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel: Auto
      NumGridPoints: Auto
      ErrorBeyondLimits: False
  Verbosity: Verbose

PhaseChangeAndTriggers:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(CheckDomain)

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.001
  MinimumTimeStep: 1e-7
  TimeStepper:
    AdamsBashforth:
      Order: 3


DomainCreator:
  Interval:
    LowerBound: [0.0]
    UpperBound: [6.283185307179586]
    Distribution: [Linear]
    InitialRefinement: [2]
    InitialGridPoints: [12]
    TimeDependence: None
    BoundaryConditions: [Periodic]

SpatialDiscretization:
  BoundaryCorrection:
    UpwindPenalty:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto

EventsAndDenseTriggers:

# [multiple_events]
EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: Fields
          VariablesToObserve: [Psi, Phi, Pi]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double, Double, Double]
          BlocksToObserve: All
      - ObserveNorms:
          SubfileName: Errors
          TensorsToObserve:
            - Name: Error(Psi)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Phi)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Pi)
              NormType: L2Norm
              Components: Sum
  - Trigger:
      TimeCompares:
        Comparison: GreaterThanOrEqualTo
        Value: 6.28
    Events:
      - Completion
#  - Trigger:
#      Times:
#        At:
#          Values: [6.28318530718]
#    Events:
#      - Completion
# [multiple_events]

Observers:
  VolumeFileName: "ScalarWavePlaneWave1DEventsAndTriggersBasicVolume"
  ReductionFileName: "ScalarWavePlaneWave1DEventsAndTriggersBasicReductions"
