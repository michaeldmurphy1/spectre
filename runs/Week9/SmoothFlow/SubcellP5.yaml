Executable: EvolveValenciaDivClean
Testing:
  Check: parse;execute
  Priority: High

---

Parallelization:
  ElementDistribution: NumGridPoints
  
ResourceInfo:
  AvoidGlobalProc0: false

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.001227184630308513
  MinimumTimeStep: 1.0e-7
  TimeStepper:
#    RungeKutta3:
    Rk3HesthavenSsp:

PhaseChangeAndTriggers:

DomainCreator:
  Brick:
    LowerBound: [0.0, 0.0, 0.0]
    UpperBound: [6.283185307179586, 6.283185307179586, 6.283185307179586]
    InitialRefinement: [3, 0, 0] # this is N_x: use [1,2,3,4,5]
    InitialGridPoints: [4, 4, 4] # This is P_x+1:  use [4,5,6]
    TimeDependence: None
    BoundaryConditions: [Periodic,Periodic,Periodic]
    Distribution: [Linear,Linear,Linear]

#AnalyticSolution:
InitialData:
  SmoothFlow:
    MeanVelocity: [0.8, 0.0, 0.0]
    WaveVector: [1.0, 0.0, 0.0]
    Pressure: 1.0
    AdiabaticIndex: 1.4
    PerturbationSize: 0.7

EquationOfState:
  FromInitialData

Interpolator:
  DumpVolumeDataOnFailure: false

EventsRunAtCleanup:
  Events: []
  ObservationValue: -1.0


SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      TroubledCellIndicator:
        RdmpTci:
          Delta0: 1.0e-7
          Epsilon: 1.0e-3
        PerssonTci:
          Exponent: 4.0
          NumHighestModes: 1
#        InitialData:
#          RdmpDelta0: 1.0e-7
#          RdmpEpsilon: 1.0e-3
#          PerssonExponent: 4.0
        FdToDgTci:
          NumberOfStepsBetweenTciCalls: 1
          MinTciCallsAfterRollback: 1
          MinimumClearTcis: 1
        AlwaysUseSubcells: false
        UseHalo: false
        OnlyDgBlocksAndGroups: None
      SubcellToDgReconstructionMethod: DimByDim
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      MinimumValueOfD: 1.0e-20
      MinimumValueOfYe: 1.0e-20
      MinimumValueOfTildeTau: 1.0e-40
      AtmosphereDensity: 1.01e-15
      SafetyFactorForB: 1.0e-12
      MagneticFieldCutoff: DoNotCheckMagneticField
  SubcellSolver:
    Reconstructor:
      MonotonisedCentralPrim:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 500
          Offset: 0
#        Specified:
#          Values: [0, 192000]
  # ? Slabs:
  #     evenlyspaced:
  #       Interval: 10
  #       Offset: 0
    Events:
#      - ObserveFields:
#          VariablesToObserve: [RestMassDensity]
#          SubfileName: element_data
#          InterpolateToMesh: None
#          CoordinatesFloatingPointType: Float
#          FloatingPointTypes: [Float]
#          BlocksToObserve: All
      - ObserveNorms:
          SubfileName: Errors
          TensorsToObserve:
            - Name: Error(RestMassDensity)
              NormType: L2Norm
              Components: Sum
  - Trigger:
      Slabs:
        Specified:
          Values: [192000]
    Events:
      - Completion

EvolutionSystem:
  ValenciaDivClean:
    DampingParameter: 1.0

VariableFixing:
  FixConservatives:
    CutoffD: &CutoffD 1.01e-15
    MinimumValueOfD: &MinimumD 1.0e-15
    SafetyFactorForB: 1.0e-12
    SafetyFactorForS: 1.0e-12
    MinimumValueOfYe: 0.0
    CutoffYe: 0.0
    SafetyFactorForSCutoffD: 1.0e-12
    SafetyFactorForSSlope: 0.0
    Enable: false
    MagneticField: AssumeNonZero
  FixToAtmosphere:
    DensityOfAtmosphere: 1.0e-15
    DensityCutoff: 1.01e-15
    #TransitionDensityCutoff: 1.0e-14
    #VelocityLimiting: 1.0e-4
    VelocityLimiting:
      AtmosphereMaxVelocity: 0
      NearAtmosphereMaxVelocity: 1.0e-4
      AtmosphereDensityCutoff: 3.0e-12
      TransitionDensityBound: 1.0e-11
    KappaLimiting:
      DensityLowerBound: 2.0e-11
      EplisonKappaMinus: 1.0e-3
      DensityUpperBound: 2.0e-10
      EpsilonKappaMax: 0.01
      MinTemperature: FromEos
      LimitAboveDensityUpperBound: False

PrimitiveFromConservative:
  CutoffDForInversion: *CutoffD
  DensityWhenSkippingInversion: *MinimumD
  KastaunMaxLorentzFactor: 10.0

      
EventsAndDenseTriggers:

Observers:
  VolumeFileName: "./GrmhdSmoothFlowSubcellP5Lev4"
  ReductionFileName: "./GrmhdSmoothFlowSubcellP5Lev4"
