Executable: EvolveGhValenciaDivCleanFdPatches
Testing:
  Check: parse;execute
  Timeout: 120
  Priority: Normal
  RequiresKokkos: True
ExpectedOutput:
  - GhMhdTovStarFdPatchesVolume0.h5
  - GhMhdTovStarFdPatchesReductions.h5

---

Parallelization:
  ElementDistribution: NumGridPoints
  UseSubcellGridPointsForDistribution: False

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Evolution:
  InitialTime: 0.0
  InitialTimeStep: &initial_time_step 0.01
  InitialSlabSize: *initial_time_step
  MinimumTimeStep: 1e-7
  LocalTimeStepping: Off
  TimeStepper:
    AdamsMoultonPcMonotonic:
      Order: 3
  LtsStepChoosers:
  VariableOrderAlgorithm:
    GoalOrder: 3

PhaseChangeAndTriggers:

InitialData: &InitialData
  GeneralizedHarmonic(TovStar):
    CentralDensity: 1.28e-3
    EquationOfState:
        PolytropicFluid:
            PolytropicConstant: 100.0
            PolytropicExponent: 2.0
    Coordinates: Isotropic

EquationOfState:
  FromInitialData

# The TOV star is centered in a periodic cube, so the variables are
# continuous across the periodic faces (with kinks in their derivatives)
DomainCreator:
  Brick:
    LowerBound: [-12.0, -12.0, -12.0]
    UpperBound: [12.0, 12.0, 12.0]
    Distribution: [Linear, Linear, Linear]
    InitialRefinement: [1, 1, 1]
    InitialGridPoints: [5, 5, 5]
    TimeDependence: None
    BoundaryConditions: [Periodic, Periodic, Periodic]

VariableFixing:
  FixConservatives:
    Enable: false # Only needed when not using Kastaun for recovery
    CutoffD: &CutoffD 1.1e-15
    MinimumValueOfD: &MinimumD 1.0e-15
    CutoffYe: 0.0
    MinimumValueOfYe: 0.0
    SafetyFactorForB: &BSafetyFactor 1.0e-12
    SafetyFactorForS: 1.0e-12
    SafetyFactorForSCutoffD: 1.0e-8
    SafetyFactorForSSlope: 0.0001
    MagneticField: AssumeZero
  FixToAtmosphere:
    DensityOfAtmosphere: 1.0e-15
    DensityCutoff: &AtmosphereDensityCutoff 1.1e-15
    VelocityLimiting:
      AtmosphereMaxVelocity: 0
      NearAtmosphereMaxVelocity: 1.0e-4
      AtmosphereDensityCutoff: 3.0e-15
      TransitionDensityBound: 3.0e-14
    KappaLimiting:
      DensityLowerBound: 2.0e-14
      EplisonKappaMinus: 1.0e-3
      DensityUpperBound: 2.0e-13
      EpsilonKappaMax: 0.01
      LimitAboveDensityUpperBound: False
      MinTemperature: FromEos
  LimitLorentzFactor:
    Enable: true
    MaxDensityCutoff: 1.0e-12
    LorentzFactorCap: 10.0

PrimitiveFromConservative:
  CutoffDForInversion: *CutoffD
  DensityWhenSkippingInversion: *MinimumD
  KastaunMaxLorentzFactor: 10.0

EvolutionSystem:
  ValenciaDivClean:
    DampingParameter: 0.0
  GeneralizedHarmonic:
    GaugeCondition:
      Harmonic:
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.01
        Amplitude: 0.12
        Width: 7.884855
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -0.999
        Amplitude: 0.999
        Width: 30.0
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.01
        Amplitude: 1.2
        Width: 7.884855
        Center: [0.0, 0.0, 0.0]

SpatialDiscretization:
  BoundaryCorrection:
    ProductUpwindPenaltyAndHll:
      UpwindPenalty:
      Hll:
        MagneticFieldMagnitudeForHydro: 1.0e-30
        LightSpeedDensityCutoff: 1.0e-8
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
      - Hypercube:
          HalfPower: 64
          Enable: true
          BlocksToFilter: All
          VolumeFilterOnSubstep: true
          BoundaryCorrectionFilterOnSubstep: false
          VolumeFilterEveryNSteps: None
          BoundaryCorrectionFilterEveryNSteps: None
    OnlyDgBlocksAndGroups: None
    Subcell:
      TroubledCellIndicator:
        PerssonTci:
          Exponent: 4.0
          NumHighestModes: 1
        RdmpTci:
          Delta0: 1.0e-7
          Epsilon: 1.0e-3
        FdToDgTci:
          NumberOfStepsBetweenTciCalls: 1
          MinTciCallsAfterRollback: 1
          MinimumClearTcis: 1
        AlwaysUseSubcells: true
        EnableExtensionDirections: false
        UseHalo: false
      SubcellToDgReconstructionMethod: DimByDim
      FiniteDifferenceDerivativeOrder: 2
      FdInterpolationOrder: 1
    TciOptions:
      MinimumValueOfD: 1.0e-20
      MinimumValueOfYe: 1.0e-20
      MinimumValueOfTildeTau: 1.0e-50
      AtmosphereDensity: *AtmosphereDensityCutoff
      SafetyFactorForB: *BSafetyFactor
      MagneticFieldCutoff: DoNotCheckMagneticField
  SubcellSolver:
    Reconstructor:
      MonotonisedCentralPrim:
        AtmosphereTreatment: Never
        ReconstructRhoTimesTemperature: true
    FilterOptions:
      SpacetimeDissipation: 0.1

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        Specified:
          Values: [0, 2]
    Events:
      - ObserveNorms:
          SubfileName: Norms
          BlocksToObserve: All
          ReductionScope: WholeDomain
          TensorsToObserve:
            - Name: SpacetimeMetric
              NormType: L2Norm
              Components: Individual
            - Name: Pi
              NormType: L2Norm
              Components: Individual
            - Name: Phi
              NormType: L2Norm
              Components: Individual
            - Name: TildeD
              NormType: L2Norm
              Components: Individual
            - Name: TildeTau
              NormType: L2Norm
              Components: Individual
            - Name: TildeS
              NormType: L2Norm
              Components: Individual
            - Name: RestMassDensity
              NormType: Max
              Components: Individual
            - Name: Pressure
              NormType: L2Norm
              Components: Individual
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - SpacetimeMetric
            - Pi
            - Phi
            - TildeD
            - TildeYe
            - TildeTau
            - TildeS
            - TildeB
            - TildePhi
            - RestMassDensity
            - Pressure
            - SpatialVelocity
            - LorentzFactor
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All
  - Trigger:
      Slabs:
        Specified:
          Values: [2]
    Events:
      - Completion

EventsAndTriggersAtSteps:

# Observed by dense output between steps, on the device for the FD elements
EventsAndDenseTriggers:
  - Trigger:
      Times:
        Specified:
          Values: [0.015]
    Events:
      - ObserveNorms:
          SubfileName: DenseNorms
          BlocksToObserve: All
          ReductionScope: WholeDomain
          TensorsToObserve:
            - Name: SpacetimeMetric
              NormType: L2Norm
              Components: Individual
            - Name: RestMassDensity
              NormType: Max
              Components: Individual

Patches:
  MaxElementsPerPatch: Auto
  DedicatedProcs: false
  ObserveOnDevice: true

EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:

Observers:
  VolumeFileName: "GhMhdTovStarFdPatchesVolume"
  ReductionFileName: "GhMhdTovStarFdPatchesReductions"

InterpolationTargets:
  BondiSachsInterpolation:
    LMax: 16
    Radius: [1]
    Center: [0, 0, 0]
    AngularOrdering: Cce

Cce:
  BondiSachsOutputFilePrefix: "BondiSachs"

Interpolator:
  Verbosity: Silent
