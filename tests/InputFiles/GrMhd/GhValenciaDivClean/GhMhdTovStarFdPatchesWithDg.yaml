# GhMhdTovStarFdPatches.yaml with DG elements next to the patches: the
# outermost blocks in x of the periodic domain are DG-only, so the elements next
# to them (10 < |x| < 15, outside the star) stay on the DG grid too, and the FD
# elements at |x| < 10, in patches, exchange boundary data with them. The slab
# size is chosen over the DG elements and the patches together.

Executable: EvolveGhValenciaDivCleanFdPatches
Testing:
  Check: parse;execute_check_output
  Timeout: 120
  Priority: Normal
  RequiresKokkos: True
ExpectedOutput:
  - GhMhdTovStarFdPatchesWithDgVolume0.h5
  - GhMhdTovStarFdPatchesWithDgReductions.h5

# The reductions of EvolveGhValenciaDivClean (all elements in the
# DgElementArray) for this input without the Patches options
